# Builds and tests on the three platforms Pd runs on.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      PD_CHOCOLATEY_VERSION: 0.55.2

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # soundfile writes the fixtures. Without it the tests skip rather than
      # fail.
      - name: Install soundfile
        run: python -m pip install --upgrade soundfile

      - name: Install Pd (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y puredata-core

      - name: Install Pd (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask pd || true

      # Pd's headers alone are not enough on Windows: a DLL cannot leave Pd's
      # symbols undefined, so Pd is installed for pd.lib, and the smoke test
      # runs the pd it installs. The package checks the installer against a
      # pinned hash.
      - name: Install Pd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install puredata --version $env:PD_CHOCOLATEY_VERSION -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "$env:ProgramFiles/Pd"
          "PD_INCLUDE_DIR=$root/src"     | Out-File -Append $env:GITHUB_ENV
          "PD_LIBRARY=$root/bin/pd.lib"  | Out-File -Append $env:GITHUB_ENV

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          if [ -n "${PD_INCLUDE_DIR:-}" ]; then
            args+=(-DPD_INCLUDE_DIR="$PD_INCLUDE_DIR" -DPD_LIBRARY="$PD_LIBRARY")
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: audiofile-${{ matrix.os }}
          path: |
            build/audiofile.pd_darwin
            build/audiofile.pd_linux
            build/Release/audiofile.dll
          if-no-files-found: warn
