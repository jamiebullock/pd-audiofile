# Builds and tests on the three platforms Pd runs on. One extra job links
# against a stub that compiles miniaudio itself, because otherwise the
# embedding path is never exercised until someone embeds it; what that tests
# is linkage and macro agreement, which is not platform-specific.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / host miniaudio ${{ matrix.use_host_miniaudio }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Quoted: bare ON/OFF are YAML booleans, and the string is what
        # both CMake and the comparison below want.
        use_host_miniaudio: ['OFF']
        include:
          - os: ubuntu-latest
            use_host_miniaudio: 'ON'

    env:
      PD_VERSION: 0.55-2
      PD_MSW_SHA256: f66025c3f0e0a778638c0b9b1a091e60f0c5ebaced70001d76f202943c1ce062

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ffmpeg widens the fixture set to FLAC, MP3 and Vorbis. Without it the
      # tests skip those rather than fail.
      - name: Install ffmpeg and Pd (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg puredata-core

      - name: Install ffmpeg and Pd (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg || true
          brew install --cask pd || true

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ffmpeg

      # Pd's headers alone are not enough on Windows: a DLL cannot leave Pd's
      # symbols undefined, so the binary distribution is fetched for pd.lib.
      # The smoke test then runs the pd.exe out of this archive, so it is
      # fetched over TLS and checked against its hash before anything in it
      # is unpacked.
      - name: Fetch Pd for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://msp.ucsd.edu/Software/pd-$env:PD_VERSION.msw.zip"
          Invoke-WebRequest -Uri $url -OutFile pd.zip
          $actual = (Get-FileHash pd.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:PD_MSW_SHA256) {
            throw "pd-$env:PD_VERSION.msw.zip is $actual, expected $env:PD_MSW_SHA256"
          }
          Expand-Archive pd.zip -DestinationPath pd-msw
          $root = (Get-ChildItem pd-msw -Directory | Select-Object -First 1).FullName
          "PD_INCLUDE_DIR=$root/src"     | Out-File -Append $env:GITHUB_ENV
          "PD_LIBRARY=$root/bin/pd.lib"  | Out-File -Append $env:GITHUB_ENV

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build
                -DCMAKE_BUILD_TYPE=Release
                -DAUDIOFILE_USE_HOST_MINIAUDIO=${{ matrix.use_host_miniaudio }})
          if [ "${{ matrix.use_host_miniaudio }}" = "ON" ]; then
            args+=(-DAUDIOFILE_HOST_MINIAUDIO_STUB=ON)
          fi
          if [ -n "${PD_INCLUDE_DIR:-}" ]; then
            args+=(-DPD_INCLUDE_DIR="$PD_INCLUDE_DIR" -DPD_LIBRARY="$PD_LIBRARY")
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - uses: actions/upload-artifact@v4
        if: matrix.use_host_miniaudio == 'OFF'
        with:
          name: audiofile-${{ matrix.os }}
          path: |
            build/audiofile.pd_darwin
            build/audiofile.pd_linux
            build/Release/audiofile.dll
          if-no-files-found: warn

  sanitizers:
    name: sanitizers / ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address-undefined]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # miniaudio reads ahead on a thread of its own, so the reads this makes
      # are concurrent with it whatever Pd does.
      - name: Configure
        run: |
          if [ "${{ matrix.sanitizer }}" = "thread" ]; then
            flags="-fsanitize=thread -g"
          else
            flags="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="$flags" -DCMAKE_EXE_LINKER_FLAGS="$flags"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        # pd_smoke is left out: Pd cannot load a sanitizer-instrumented
        # external without the sanitizer runtime being preloaded.
        run: ctest --test-dir build --output-on-failure -R core
